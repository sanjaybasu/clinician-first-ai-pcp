# Paper 2 development pathway v20 (S. Basu option (a), 2026-11-06): node complete_high_risk sends a completed workup in
# the NICE high-risk group, or a person who feels very unwell, to same-day care. Earlier notes follow.
# Paper 2 development pathway 0.3.0-dev (v14): routine visit when a bacterial-sinusitis criterion is present or cannot be
# answered, home care otherwise; approved by S. Basu on 2026-11-05.
# Guideline pathway: acute rhinosinusitis symptoms in adults (URI lane).
# Paper 2 development pathway, signed by S. Basu on 2026-11-05 (design/pathway_schema.md). Every source resolved in PubMed on 2026-11-04;
# section-level support for each node stays unverified until the signing physician checks the cited section.
pathway: acute_sinusitis
version: "0.4.0-dev"
script: acute_sinusitis@1.2.0-dev
status: signed
signed_by: "S. Basu 2026-11-05"
sources:
  nice_ng79:
    citation: "NICE. Sinusitis (acute): antimicrobial prescribing. NICE guideline NG79. 27 October 2017. Recommendation 1.1.8 (systemically very unwell, more serious illness, or high risk of complications: immediate antibiotic)"
    url: "https://www.nice.org.uk/guidance/ng79/chapter/Recommendations"
  nice_ng120:
    citation: "NICE. Cough (acute): antimicrobial prescribing. NICE guideline NG120. 7 February 2019. Recommendations 1.1.15-1.1.16 (higher risk of complications; consider an immediate or back-up antibiotic, ideally at a face-to-face clinical examination)"
    url: "https://www.nice.org.uk/guidance/ng120/chapter/Recommendations"
  basu_2026_11_06_same_day:
    citation: "S. Basu decision of 2026-11-06 (option a): a person in the NICE high-risk group, or who describes being very unwell, gets same-day clinician care; NICE names the group but sets no time frame"
  chow2012:
    citation: "Chow AW, et al. IDSA clinical practice guideline for acute bacterial rhinosinusitis in children and adults. Clin Infect Dis. 2012;54(8):e72-e112"
    pmid: "22438350"
  rosenfeld2015:
    citation: "Rosenfeld RM, et al. Clinical practice guideline (update): adult sinusitis. Otolaryngol Head Neck Surg. 2015;152(2 Suppl):S1-S39"
    pmid: "25832968"
  harris2016:
    citation: "Harris AM, et al. Appropriate antibiotic use for acute respiratory tract infection in adults: advice for high-value care from the ACP and the CDC. Ann Intern Med. 2016;164(6):425-434"
    pmid: "26785402"
  basu_2026_11_05_unknown:
    citation: "S. Basu decision of 2026-11-05: a bacterial-sinusitis criterion the patient cannot answer is treated as possibly present (routine visit)"
  judgment:
    citation: "Development judgment (conservative choice where no cited source sets the level)"
nodes:
  - id: escalate
    when: {kinds: [escalate]}
    disposition: {level: emergency_now, within_hours: 0}
    source: [chow2012, rosenfeld2015]
  - id: open
    when: {kinds: [ask]}
    standing: {level: clinician_review, within_hours: 24}
    source: [judgment]
  - id: defer
    when: {kinds: [defer]}
    disposition: {level: clinician_review, within_hours: 24}
    source: [judgment]
  - id: complete_high_risk
    when: {kinds: [complete], red_flags_any: [high_risk_condition, older_high_risk, very_unwell]}
    disposition: {level: urgent_same_day, within_hours: 24}
    proposals:
      - {kind: medication_review, name: "NICE high-risk group or very unwell: same-day face-to-face examination; consider an immediate or back-up antibiotic per NICE NG79", source: [nice_ng79]}
    source: [basu_2026_11_06_same_day, nice_ng120, nice_ng79]
  - id: complete_bacterial_criteria
    when: {kinds: [complete], red_flags_any: [symptoms_10_days_plus, worse_after_better, severe_onset]}
    disposition: {level: routine_visit, within_hours: 72}
    proposals:
      - {kind: medication_review, name: "Bacterial sinusitis criteria met: clinician visit to decide between antibiotics and watchful waiting; no sinus imaging for uncomplicated acute rhinosinusitis", source: [chow2012, rosenfeld2015, harris2016]}
    source: [chow2012, rosenfeld2015]
  - id: complete_criteria_unknown
    when: {kinds: [complete], unanswered_any: [symptoms_10_days_plus, worse_after_better, severe_onset]}
    disposition: {level: routine_visit, within_hours: 72}
    proposals:
      - {kind: medication_review, name: "A bacterial sinusitis criterion could not be answered remotely: clinician visit to decide between antibiotics and watchful waiting; no sinus imaging for uncomplicated acute rhinosinusitis", source: [chow2012, rosenfeld2015, harris2016]}
    source: [basu_2026_11_05_unknown, chow2012]
  - id: complete
    when: {kinds: [complete]}
    disposition: {level: self_care}
    proposals:
      - {kind: medication_review, name: "Antibiotics only if bacterial sinusitis criteria are met (symptoms 10 days or more without improvement, severe onset, or worsening after initial improvement); no sinus imaging for uncomplicated acute rhinosinusitis", source: [chow2012, rosenfeld2015, harris2016]}
    source: [rosenfeld2015, harris2016]
