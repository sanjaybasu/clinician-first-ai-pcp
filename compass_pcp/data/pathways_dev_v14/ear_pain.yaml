# Paper 2 development pathway 0.2.0-dev (v12): adds the treatment-failure node, approved by S. Basu on 2026-11-05.
# Guideline pathway: ear pain in adults (URI lane).
# Paper 2 development pathway, signed by S. Basu on 2026-11-05 (design/pathway_schema.md). Every source resolved in PubMed on 2026-11-04;
# section-level support for each node stays unverified until the signing physician checks the cited section.
pathway: ear_pain
version: "0.2.0-dev"
script: ear_pain@1.1.0-dev
status: signed
signed_by: "S. Basu 2026-11-05"
sources:
  rosenfeld2014:
    citation: "Rosenfeld RM, et al. Clinical practice guideline: acute otitis externa. Otolaryngol Head Neck Surg. 2014;150(1 Suppl):S1-S24"
    pmid: "24491310"
  basu_2026_11_05:
    citation: "S. Basu decision of 2026-11-05: ear pain while on, or within 2 weeks after, an antibiotic is possible treatment failure and needs a same-day in-person exam"
  judgment:
    citation: "Development judgment (conservative choice where no cited source sets the level)"
nodes:
  - id: escalate_mastoid_or_intracranial
    when: {kinds: [escalate], red_flags_any: [swelling_behind_ear, ear_pushed_forward, severe_headache_or_stiff_neck, confusion_or_drowsiness]}
    disposition: {level: emergency_now, within_hours: 0}
    source: [judgment]
  - id: treatment_failure
    when: {kinds: [escalate], red_flags_any: [on_antibiotics_for_this]}
    disposition: {level: urgent_same_day, within_hours: 24}
    proposals:
      - {kind: referral, name: "Same-day in-person otoscopy for possible treatment failure; review the current antibiotic", source: [basu_2026_11_05]}
    source: [basu_2026_11_05]
  - id: escalate
    when: {kinds: [escalate]}
    disposition: {level: emergency_now, within_hours: 0}
    source: [judgment]
  - id: open
    when: {kinds: [ask]}
    standing: {level: clinician_review, within_hours: 24}
    source: [judgment]
  - id: defer
    when: {kinds: [defer]}
    disposition: {level: clinician_review, within_hours: 24}
    source: [judgment]
  - id: complete
    when: {kinds: [complete]}
    disposition: {level: routine_visit, within_hours: 72}
    proposals:
      - {kind: referral, name: "In-person otoscopy to distinguish otitis media from otitis externa before any antibiotic", source: [rosenfeld2014]}
    source: [rosenfeld2014, judgment]
