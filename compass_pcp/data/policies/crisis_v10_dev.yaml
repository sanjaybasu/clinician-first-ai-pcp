  lexicon:
  - overdose
  - overdosed
  - od
  - o.d.
  - odd
  - took too many
  - took all my pills
  - took the whole bottle
  - double dose
  - took it twice
  - wrong pills
  - swallowed
  - ate some pills
  - got into my meds
  - got into the medicine
  - drank bleach
  - drank cleaner
  - poison
  - poisoned
  - narcan
  - naloxone
  - fent
  - fetty
  - pressies
  - percs
  - xans
  - wont wake up
  - cant wake him
  - cant wake her
  - lips are blue
  classifier_cut: null
  classifier_cut_source: null
  criteria:
  - id: OD-01
    description: 'A person who used or may have used opioids or other drugs is now hard to wake or will not wake, is breathing
      slowly or not at all, is making choking, gurgling, or snoring sounds while not awake, has blue, purple, gray, or ashen
      lips or nails, or has pinpoint pupils. Counts as present: Any listed sign now, in a person with known or possible drug
      use. Uncertain: Drowsy after drug use with breathing not described; ''nodding out''; ''really out of it''. Currentness:
      current = sign present now or since the last time the sender saw the person. Naloxone given and the person woke up ->
      still current (signs can return).'
    route: emergency_911
    routing_relevant: true
    requires_current: true
    source: samhsa_overdose_toolkit
    source_ids:
    - samhsa_overdose_toolkit
    - samhsa_988_faq
    instruction:
      id: instr_OD-01
      text: Call 911 now. If you have naloxone (Narcan), give it now. Stay with the person and watch their breathing.
      text_other: null
      fallback: Call 911 now. If you have naloxone (Narcan), give it now. Stay with the person and watch their breathing.
      fallback_other: null
      source: signed:OD-01
  - id: OD-02
    description: 'After swallowing, breathing in, or touching a medicine, drug, alcohol, or chemical, the person has collapsed,
      had a seizure, has trouble breathing, or cannot be woken up. Counts as present: Any of collapse, seizure, trouble breathing,
      or cannot be woken, with a known or suspected exposure. Uncertain: Confused, very sleepy, vomiting while drowsy, or
      chest pain after an exposure (judgment: the source lists only the four signs). Currentness: current = sign present now
      or since the exposure.'
    route: emergency_911
    routing_relevant: true
    requires_current: true
    source: apc_poisonhelp
    source_ids:
    - apc_poisonhelp
    instruction:
      id: instr_OD-02
      text: Call 911 now. Stay with the person. If you can, keep the medicine or bottle to show the responders.
      text_other: null
      fallback: Call 911 now. Stay with the person. If you can, keep the medicine or bottle to show the responders.
      fallback_other: null
      source: signed:OD-02
  - id: OD-03
    description: 'The person took or swallowed more than prescribed, or took any substance, to hurt or kill themself, or a
      sender reports this about someone. No symptoms does not clear it. Counts as present: Ingestion or exposure with stated
      or clearly implied self-harm intent (''took all my pills because I''m done''). Uncertain: Large or unusual amount with
      no stated reason; ''took a bunch to sleep forever''; intent unclear. Currentness: current = exposure today or not yet
      medically assessed. Absence of symptoms does not change currentness.'
    route: emergency_911
    routing_relevant: true
    requires_current: true
    source: samhsa_988_faq
    source_ids:
    - samhsa_988_faq
    - hrsa_poisonhelp_2013
    - apc_poisonhelp_tool
    instruction:
      id: instr_OD-03
      text: Call 911 now, even if you feel okay. Some medicines hurt you hours later. You can also call or text 988.
      text_other: Call 911 now for this person, even if they seem okay. Stay with them until help comes if it is safe to do
        so.
      fallback: Call 911 now, even if you feel okay. Some medicines hurt you hours later. You can also call or text 988.
      fallback_other: Call 911 now for this person, even if they seem okay. Stay with them until help comes if it is safe
        to do so.
      source: signed:OD-03
  - id: OD-04
    description: 'Someone swallowed, breathed in, or touched a medicine, drug, or chemical by accident (a child got into pills,
      a double dose, the wrong medicine, a cleaning product), and has none of the OD-01 or OD-02 signs. Counts as present:
      An accidental exposure is reported and no OD-01/OD-02 sign is reported. Uncertain: Unclear whether anything was swallowed
      (''the bottle was open'', ''might have eaten one''); unclear amount. Currentness: current = exposure today or not yet
      assessed by Poison Control or a clinician.'
    route: poison_control_addition
    routing_relevant: true
    requires_current: true
    source: apc_poisonhelp
    source_ids:
    - apc_poisonhelp
    - hrsa_poisonhelp_2013
    instruction:
      id: instr_OD-04
      text: Call Poison Control now at 1-800-222-1222. Do not wait for signs of poisoning. If the person collapses, has a
        seizure, has trouble breathing, or cannot be woken up, call 911.
      text_other: null
      fallback: Call Poison Control now at 1-800-222-1222. Do not wait for signs of poisoning. If the person collapses, has
        a seizure, has trouble breathing, or cannot be woken up, call 911.
      fallback_other: null
      source: signed:OD-04
- id: acute_cardiac
  name: Possible acute cardiac
  lexicon:
  - chest pain
  - chest pressure
  - chest tightness
  - chest hurts
  - chest feels heavy
  - elephant on my chest
  - squeezing in my chest
  - cp
  - heart attack
  - heart atack
  - hart attack
  - angina
  - jaw pain
  - left arm pain
  - arm is numb
  - pain in my back between my shoulders
  - upper stomach pain
  - cant catch my breath
  - short of breath
  - sob
  - cold sweat
  - sweating and nauseous
  - lightheaded
  - passed out
  - fainted
  - nitro
  - nitroglycerin
  - heartburn that wont go away
  classifier_cut: null
  classifier_cut_source: null
  criteria:
  - id: CA-01
    description: 'The person has pain, pressure, tightness, squeezing, heaviness, or discomfort in the chest now. Counts as
      present: Any current chest pain or discomfort, of any description, not already evaluated by a clinician for this episode.
      Uncertain: Unclear whether the pain is current; vague ''chest feels weird''; pain the sender links to anxiety or heartburn
      with no clinician evaluation. Currentness: current = present now, or came and went today and is still recurring. Fully
      resolved earlier episode -> CA-04.'
    route: emergency_911
    routing_relevant: true
    requires_current: true
    source: gulati_2021_es
    source_ids:
    - gulati_2021_es
    - nhlbi_heart_attack
    instruction:
      id: instr_CA-01
      text: Call 911 now. Do not drive yourself to the hospital or let someone else drive you. Chest pain needs to be checked
        right away.
      text_other: Call 911 now for this person. Do not drive them to the hospital.
      fallback: Call 911 now. Do not drive yourself to the hospital or let someone else drive you. Chest pain needs to be
        checked right away.
      fallback_other: Call 911 now for this person. Do not drive them to the hospital.
      source: signed:CA-01
  - id: CA-02
    description: 'The person has new pain, pressure, tightness, or discomfort now in the shoulders, arms, neck, jaw, back,
      or upper belly, or new shortness of breath, with no chest pain. Fatigue counts only together with one of these. Counts
      as present: A listed symptom now, new or worse than usual, with no clear other cause; higher weight if with sweating,
      nausea or vomiting, lightheadedness, or in a woman, an older adult, or a person with diabetes. Uncertain: Long-standing
      or usual-pattern symptom; a symptom with a plausible other cause (strained shoulder lifting, known asthma flare) and
      no clinician evaluation. Throat pain in a person with a sore throat, or pain on swallowing, is not neck pain for
      this item: count it as absent. Currentness: current = present now. Resolved -> CA-04.'
    route: emergency_911
    routing_relevant: true
    requires_current: true
    source: gulati_2021_es
    source_ids:
    - gulati_2021_es
    - nhlbi_heart_attack
    instruction:
      id: instr_CA-02
      text: Call 911 now. These symptoms can be a sign of a heart problem. Do not drive yourself to the hospital.
      text_other: Call 911 now for this person. Do not drive them to the hospital.
      fallback: Call 911 now. These symptoms can be a sign of a heart problem. Do not drive yourself to the hospital.
      fallback_other: Call 911 now for this person. Do not drive them to the hospital.
      source: signed:CA-02
  - id: CA-03
    description: 'A person aged 75 or older (stated or from the record) has, now or today, new shortness of breath, fainted,
      became suddenly confused, or fell without a clear reason. Counts as present: Age 75 or older and one listed event now
      or today. Uncertain: Age unknown with a listed event; fall with a clear trip mechanism but no injury information. Currentness:
      current = now or today.'
    route: urgent_review
    routing_relevant: true
    requires_current: true
    source: gulati_2021_es
    source_ids:
    - gulati_2021_es
    instruction:
      id: instr_CA-03
      text: A nurse or doctor needs to check on this today. If you have chest pain, trouble breathing, or you faint again,
        call 911.
      text_other: This person needs to be checked by a nurse or doctor today. If they have chest pain, trouble breathing,
        or faint again, call 911.
      fallback: A nurse or doctor needs to check on this today. If you have chest pain, trouble breathing, or you faint again,
        call 911.
      fallback_other: This person needs to be checked by a nurse or doctor today. If they have chest pain, trouble breathing,
        or faint again, call 911.
      source: signed:CA-03
  - id: CA-04
    description: 'The person had chest pain or an anginal-equivalent symptom recently that has now stopped, or has known angina
      that came with exertion and went away with rest or medicine in its usual way. Counts as present: Resolved episode within
      the recent window, or usual-pattern angina now resolved. Uncertain: Unclear whether symptoms are still present (-> uncertain
      on CA-01 or CA-02); a change in the usual angina pattern (-> treat as CA-01). Currentness: recent_not_current = stopped
      within the past 72 hours [judgment: window drafted, not sourced]. Angina that is new, at rest, lasts longer, or does
      not go away with rest or medicine -> CA-01 (current).'
    route: urgent_review
    routing_relevant: true
    requires_current: false
    source: gulati_2021_es
    source_ids:
    - gulati_2021_es
    - nhlbi_heart_attack
    instruction:
      id: instr_CA-04
      text: If the pain comes back, call 911 right away. Do not drive yourself. I am sending this to your care team so a clinician
        can check on you.
      text_other: null
      fallback: If the pain comes back, call 911 right away. Do not drive yourself. I am sending this to your care team so
        a clinician can check on you.
      fallback_other: null
      source: signed:CA-04
