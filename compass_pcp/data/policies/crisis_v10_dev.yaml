families:
- id: suicide_self_harm
  name: Suicide or self-harm
  lexicon:
  - kill myself
  - kms
  - kys
  - suicide
  - suicidal
  - sucidal
  - suicde
  - end it all
  - end my life
  - unalive
  - want to die
  - wanna die
  - wish i was dead
  - wish i were dead
  - better off dead
  - better off without me
  - go to sleep and not wake up
  - dont want to wake up
  - dont want to be here anymore
  - no reason to live
  - cant go on
  - take all my pills
  - overdose on purpose
  - cut myself
  - cutting again
  - hang myself
  - shoot myself
  - jump off
  - goodbye forever
  - wrote a note
  classifier_cut: null
  classifier_cut_source: null
  criteria:
  - id: SH-01
    description: 'The person is harming or trying to kill themself now, or has just done so (for example, took pills, cut,
      hanging, gun in hand), with or without a stated intent to die. Counts as present: Any report of an act happening now
      or within the current episode (today, ''just'', ''a few minutes ago'') including an aborted act still in progress (pills
      in hand, at a height). Uncertain: Ambiguous act (''I did something stupid'', ''took a bunch''), unclear time, or unclear
      whether it was self-directed. Currentness: current = now or today and not yet medically assessed. Earlier acts -> SH-06.'
    route: emergency_911
    routing_relevant: true
    requires_current: true
    source: samhsa_988_faq
    source_ids:
    - samhsa_988_faq
    - cssrs_screener_pc
    instruction:
      id: instr_SH-01
      text: Call 911 now. You need medical help right away, even if you feel okay. You can also call or text 988.
      text_other: Call 911 now for this person. Stay with them until help comes if it is safe to do so.
      fallback: Call 911 now. You need medical help right away, even if you feel okay. You can also call or text 988.
      fallback_other: Call 911 now for this person. Stay with them until help comes if it is safe to do so.
      source: signed:SH-01
  - id: SH-02
    description: 'The person has hurt themself in a way that may need emergency medical care now (heavy bleeding, deep cut,
      swallowed something, trouble breathing, cannot stay awake), whatever the intent. Counts as present: Self-injury reported
      with any of: bleeding that will not stop, deep or gaping wound, ingestion, head or neck injury, trouble breathing, fainting,
      cannot stay awake, confusion. Uncertain: Self-injury reported but severity or ingestion unknown. Currentness: current
      = injury or symptoms present now, or self-harm today not yet medically assessed.'
    route: emergency_911
    routing_relevant: true
    requires_current: true
    source: samhsa_988_faq
    source_ids:
    - samhsa_988_faq
    instruction:
      id: instr_SH-02
      text: Call 911 now so you can get medical care right away. You can also call or text 988.
      text_other: Call 911 now for this person. Stay with them until help comes if it is safe to do so.
      fallback: Call 911 now so you can get medical care right away. You can also call or text 988.
      fallback_other: Call 911 now for this person. Stay with them until help comes if it is safe to do so.
      source: signed:SH-02
  - id: SH-03
    description: 'The person has a specific plan to kill or harm themself that they are carrying out or intend to carry out
      right away, and has the means; or is taking steps now to prepare (collected pills, got a gun, wrote a note, gave away
      things) with current suicidal thoughts. Counts as present: Plan + immediate intent (''tonight'', ''now'', ''today'',
      ''when everyone leaves'') + means available; or a preparatory act in the current episode together with current suicidal
      thoughts. Uncertain: Plan or intent stated but timing or means unclear; or means present with thoughts but intent unclear.
      Means possession alone is not present for SH-03 (round4_gpt.md section 1, item 4). Currentness: current = plan and intent
      are for now or the next hours; a preparatory act counts if it happened in the current episode. Older preparatory acts
      -> SH-06.'
    route: emergency_911
    routing_relevant: true
    requires_current: true
    source: samhsa_988_faq
    source_ids:
    - samhsa_988_faq
    - asq_tool
    - posner_2011
    instruction:
      id: instr_SH-03
      text: Call 911 now. If you can, move away from anything you could use to hurt yourself and stay near another person.
        You can also call or text 988.
      text_other: Call 911 now for this person. Stay with them until help comes if it is safe to do so.
      fallback: Call 911 now. If you can, move away from anything you could use to hurt yourself and stay near another person.
        You can also call or text 988.
      fallback_other: Call 911 now for this person. Stay with them until help comes if it is safe to do so.
      source: signed:SH-03
  - id: SH-04
    description: 'The person says they are thinking about killing themself right now, or has thoughts of suicide with some
      intention of acting on them, or is working out a plan, without the SH-03 immediacy and means. Counts as present: C-SSRS
      items 2-5 type statements that are current (''I keep thinking about how I''d do it'', ''I might actually do it''), or
      ASQ item 5 type (''I''m thinking about killing myself right now''). Uncertain: Indirect or vague statements where intent
      cannot be judged (''I don''t know if I can keep going like this''). Currentness: current = now or ongoing in the last
      few days with no stated resolution. Past-month thoughts stated as resolved -> SH-06.'
    route: crisis_988_page
    routing_relevant: true
    requires_current: true
    source: cssrs_community_card
    source_ids:
    - cssrs_community_card
    - cssrs_screener_pc
    - asq_tool
    instruction:
      id: instr_SH-04
      text: Please call or text 988 now to talk with a crisis counselor. It is free and open all day and night. If you might
        act on these thoughts or you are in danger, call 911.
      text_other: Please call or text 988 now. Counselors can help you support this person. If they might act on these thoughts
        or are in danger, call 911.
      fallback: Please call or text 988 now to talk with a crisis counselor. It is free and open all day and night. If you
        might act on these thoughts or you are in danger, call 911.
      fallback_other: Please call or text 988 now. Counselors can help you support this person. If they might act on these
        thoughts or are in danger, call 911.
      source: signed:SH-04
  - id: SH-05
    description: 'The person says they wish they were dead, wish they could go to sleep and not wake up, think others would
      be better off without them, or has thoughts of killing themself with no stated intent or plan; includes indirect statements
      that a reasonable clinician would read as suicidal. Counts as present: Current passive ideation (C-SSRS item 1; ASQ
      items 1-2), active ideation without intent or plan (C-SSRS item 2), or indirect statements (''everyone would be better
      off without me'', ''I won''t be a burden much longer'', ''I just want to disappear for good'', ''giving my stuff away'').
      Uncertain: Hopelessness or exhaustion without a death wish (''I can''t do this anymore'', ''what''s the point''); idiom
      plus distress. Currentness: current = now or ongoing in the last few days with no stated resolution. Resolved past-month
      thoughts -> SH-06.'
    route: crisis_988_page
    routing_relevant: true
    requires_current: true
    source: asq_tool
    source_ids:
    - asq_tool
    - cssrs_screener_pc
    - horowitz_2012
    - samhsa_988_faq
    instruction:
      id: instr_SH-05
      text: Please call or text 988 now to talk with a crisis counselor. It is free and open all day and night. If you might
        act on these thoughts or you are in danger, call 911.
      text_other: Please call or text 988 now. Counselors can help you support this person. If they might act on these thoughts
        or are in danger, call 911.
      fallback: Please call or text 988 now to talk with a crisis counselor. It is free and open all day and night. If you
        might act on these thoughts or you are in danger, call 911.
      fallback_other: Please call or text 988 now. Counselors can help you support this person. If they might act on these
        thoughts or are in danger, call 911.
      source: signed:SH-05
  - id: SH-06
    description: 'The person reports suicidal thoughts in the past month that they say have stopped, or a suicide attempt,
      self-harm act, or preparatory act in the past 3 months, with no current ideation. Counts as present: Past-month ideation
      stated as resolved; attempt, self-harm, or preparatory act within 3 months with no current ideation. Uncertain: Time
      of the past act or thoughts unclear; or unclear whether thoughts are still present (-> treat as uncertain on SH-05).
      Currentness: recent_not_current = ideation within the past month, or behavior within the past 3 months (C-SSRS screener
      windows). Older -> historical, normal path.'
    route: urgent_review
    routing_relevant: true
    requires_current: false
    source: cssrs_screener_pc
    source_ids:
    - cssrs_screener_pc
    - tjc_npsg_15_r3
    instruction:
      id: instr_SH-06
      text: Thank you for telling me. I am sending this to your care team. If these thoughts come back, call or text 988 any
        time, or call 911 if you are in danger.
      text_other: null
      fallback: Thank you for telling me. I am sending this to your care team. If these thoughts come back, call or text 988
        any time, or call 911 if you are in danger.
      fallback_other: null
      source: signed:SH-06
