      approved by signer change A7; NICE times CT from the injury but sets no remote-advice window].'
    route: er_now
    routing_relevant: true
    requires_current: true
    source: nice_ng232
    source_ids:
    - nice_ng232
    - acep_is_it_emergency
    instruction:
      id: instr_FA-02
      text: Go to the nearest emergency room now to be checked for bleeding in the head. Do not drive yourself. If you get
        very sleepy, confused, or throw up again, call 911.
      text_other: Please take this person to the nearest emergency room now. Do not let them drive. If they get very sleepy,
        confused, or throw up again, call 911.
      fallback: Go to the nearest emergency room now to be checked for bleeding in the head. Do not drive yourself. If you
        get very sleepy, confused, or throw up again, call 911.
      fallback_other: Please take this person to the nearest emergency room now. Do not let them drive. If they get very sleepy,
        confused, or throw up again, call 911.
      source: signed:FA-02
- id: maternity_ob
  name: 'Pregnancy and the year after birth (taxonomy: maternity_ob)'
  lexicon:
  - pregnant
  - preg
  - pregnet
  - weeks along
  - postpartum
  - post partum
  - just had a baby
  - had my baby
  - c section
  - c-section
  - baby not moving
  - baby isnt moving
  - baby stopped moving
  - water broke
  - leaking fluid
  - bleeding while pregnant
  - soaking a pad
  - swollen face and hands
  - seeing spots
  - blurry vision pregnant
  - preeclampsia
  - thoughts of hurting my baby
  classifier_cut: null
  classifier_cut_source: null
  criteria:
  - id: MO-01
    description: 'A person who is pregnant or gave birth in the past year has chest pain, obstructed breathing or shortness
      of breath, a seizure, or thoughts of hurting themself or their baby. Counts as present: Any listed sign now, in the
      perinatal window. Uncertain: Perinatal status unknown; ''scary thoughts'' without content (intrusive thoughts can be
      distressing without intent; the source still says call 911). Currentness: current = now.'
    route: emergency_911
    routing_relevant: true
    requires_current: true
    source: awhonn_post_birth
    source_ids:
    - awhonn_post_birth
    - cdc_hear_her
    instruction:
      id: instr_MO-01
      text: Call 911 now. Tell them you are pregnant or had a baby in the past year. These signs can be life-threatening.
      text_other: Call 911 now for this person. Tell them she is pregnant or had a baby in the past year.
      fallback: Call 911 now. Tell them you are pregnant or had a baby in the past year. These signs can be life-threatening.
      fallback_other: Call 911 now for this person. Tell them she is pregnant or had a baby in the past year.
      source: signed:MO-01
  - id: MO-02
    description: 'A person who is pregnant or gave birth in the past year has: a headache that will not go away or gets worse;
      dizziness or fainting; vision changes; fever of 100.4 F or higher; extreme swelling of hands or face; fast-beating heart;
      severe nausea and throwing up; severe belly pain that does not go away; baby moving less or not at all during pregnancy;
      vaginal bleeding or fluid leaking during pregnancy; heavy vaginal bleeding or discharge after pregnancy; severe swelling,
      redness, or pain of a leg or arm; or overwhelming tiredness. Counts as present: Any listed sign now, in the perinatal
      window. Uncertain: Perinatal status unknown; usual pregnancy discomforts the person describes as mild. Currentness:
      current = now.'
    route: er_now
    routing_relevant: true
    requires_current: true
    source: cdc_hear_her
    source_ids:
    - cdc_hear_her
    - awhonn_post_birth
    instruction:
      id: instr_MO-02
      text: Go to the nearest emergency room now, and tell them you are pregnant or had a baby in the past year. If you have
        chest pain, trouble breathing, or a seizure, call 911.
      text_other: Please take her to the nearest emergency room now, and tell them she is pregnant or had a baby in the past
        year. If she has chest pain, trouble breathing, or a seizure, call 911.
      fallback: Go to the nearest emergency room now, and tell them you are pregnant or had a baby in the past year. If you
        have chest pain, trouble breathing, or a seizure, call 911.
      fallback_other: Please take her to the nearest emergency room now, and tell them she is pregnant or had a baby in the
        past year. If she has chest pain, trouble breathing, or a seizure, call 911.
      source: signed:MO-02
- id: environmental_housing_safety
  name: 'Violence at home and environmental danger (taxonomy: environmental_housing_safety)'
  lexicon:
  - he hit me
  - she hit me
  - hits me
  - beats me
  - choked me
  - threatened to kill me
  - scared of my boyfriend
  - scared of my husband
  - abusive
  - domestic violence
  - not safe at home
  - locked me in
  - co alarm
  - carbon monoxide
  - detector going off
  - generator inside
  - gas smell
  - no ac
  - too hot in my apartment
  - heat stroke
  - overheated
  classifier_cut: null
  classifier_cut_source: null
  criteria:
  - id: EH-01
    description: 'The person is being hurt or threatened by someone now, or says they are in immediate danger at home or where
      they are (partner, family member, or other). Counts as present: Violence or threat now, or a statement of immediate
      danger. Uncertain: Abuse described without timing; ''scared to go home''. Currentness: current = now or tonight.'
    route: emergency_911
    routing_relevant: true
    requires_current: true
    source: ndvh_hotline
    source_ids:
    - ndvh_hotline
    instruction:
      id: instr_EH-01
      text: If you are in danger right now, call 911 if it is safe to do so. If you cannot talk, you can text 911 in many
        areas.
      text_other: If this person is in danger right now, call 911.
      fallback: If you are in danger right now, call 911 if it is safe to do so. If you cannot talk, you can text 911 in many
        areas.
      fallback_other: If this person is in danger right now, call 911.
      source: signed:EH-01
    order_exception:
      required_clause: call 911
      max_sentences: 1
      source: Signer change A6, 2026-11-03
  - id: EH-02
    description: 'The person reports being hurt, threatened, controlled, or afraid of a partner, family member, or someone
      they live with, without immediate danger now. Counts as present: Abuse or fear for safety reported, not immediate. Uncertain:
      Conflict without fear or harm described. Currentness: current = ongoing or in the past month.'
    route: urgent_review
    routing_relevant: true
    requires_current: true
    source: ndvh_hotline
    source_ids:
    - ndvh_hotline
    instruction:
      id: instr_EH-02
      text: You can talk with the National Domestic Violence Hotline any time. Call 800-799-7233 or text START to 88788. It
        is free and private. I am sending this to your care team. If you are in danger, call 911.
      text_other: null
      fallback: You can talk with the National Domestic Violence Hotline any time. Call 800-799-7233 or text START to 88788.
        It is free and private. I am sending this to your care team. If you are in danger, call 911.
      fallback_other: null
      source: signed:EH-02
  - id: EH-03
    description: 'A carbon monoxide alarm is sounding, or people (or pets) in the same place have headache, dizziness, nausea,
      confusion, drowsiness, or fainting with a fuel-burning source (heater, generator, stove, car) running indoors or a suspected
      leak. Counts as present: Alarm sounding, or symptoms in the setting described. Uncertain: Symptoms with a possible source
      but unclear; alarm beeping that may be a low battery. Currentness: current = now.'
    route: emergency_911
    routing_relevant: true
    requires_current: true
    source: mp_co
    source_ids:
    - mp_co
    instruction:
      id: instr_EH-03
      text: Get everyone, including pets, outside into fresh air now. Then call 911 from outside.
      text_other: Get everyone outside into fresh air now, then call 911.
      fallback: Get everyone, including pets, outside into fresh air now. Then call 911 from outside.
      fallback_other: Get everyone outside into fresh air now, then call 911.
      source: signed:EH-03
    order_exception:
      required_clause: call 911
      max_sentences: 2
      source: Signer change A6, 2026-11-03
  - id: EH-04
    description: 'During heat exposure (hot home with no cooling, outdoor work, heat wave), the person has a very high temperature
      (above 104 F), confusion, irrational behavior, seizures, slurred speech, extreme tiredness, or is unconscious. Counts
      as present: Heat exposure plus any listed neurologic sign or temperature above 104 F. Uncertain: Heat exposure with
      heat exhaustion signs only (heavy sweating, cramps, nausea, dizziness, headache). Currentness: current = now.'
    route: emergency_911
    routing_relevant: true
    requires_current: true
    source: mp_heat
    source_ids:
    - mp_heat
    instruction:
      id: instr_EH-04
      text: Call 911 now. Move to a cooler place and cool down with water or wet cloths while you wait.
      text_other: Call 911 now for this person. Move them to a cooler place and cool them with water or wet cloths.
      fallback: Call 911 now. Move to a cooler place and cool down with water or wet cloths while you wait.
      fallback_other: Call 911 now for this person. Move them to a cooler place and cool them with water or wet cloths.
      source: signed:EH-04
- id: substance_withdrawal
  name: 'Dangerous alcohol or sedative withdrawal (taxonomy: substance_use)'
  lexicon:
  - withdrawal
  - withdrawals
  - detox
  - detoxing
  - dts
  - the dts
  - delirium tremens
  - the shakes
  - shaky since i stopped
  - stopped drinking
  - quit drinking
  - cold turkey
  - stopped my xanax
  - ran out of xanax
  - ran out of klonopin
  - out of my benzos
  - seeing bugs
  - hearing things since i stopped
  classifier_cut: null
  classifier_cut_source: null
  criteria:
  - id: SU-01
    description: 'After stopping or sharply cutting down heavy drinking, or a benzodiazepine or similar sedative, the person
      has hallucinations (seeing, hearing, or feeling things that are not there), severe confusion, fever, a fast or irregular
      heartbeat, or severe shaking with sweating. Counts as present: Recent stop or cut-down plus any listed sign now, with
      no seizure and the person awake. Uncertain: Mild shakiness or anxiety after stopping; amount or recency of drinking
      unclear. Currentness: current = now, within days of stopping or cutting down.'
    route: er_now
    routing_relevant: true
    requires_current: true
    source: asam_aw_2020
    source_ids:
    - asam_aw_2020
    - mp_alcohol_withdrawal
    - mp_lorazepam
    instruction:
      id: instr_SU-01
      text: Go to the nearest emergency room now. Withdrawal from alcohol or sedatives can quickly become dangerous. If you
        have a seizure, or someone cannot wake you, they should call 911.
      text_other: Please take this person to the nearest emergency room now. If they have a seizure or you cannot wake them,
        call 911.
      fallback: Go to the nearest emergency room now. Withdrawal from alcohol or sedatives can quickly become dangerous. If
        you have a seizure, or someone cannot wake you, they should call 911.
      fallback_other: Please take this person to the nearest emergency room now. If they have a seizure or you cannot wake
        them, call 911.
      source: signed:SU-01
  - id: SU-02
    description: 'After stopping or sharply cutting down heavy drinking, or a benzodiazepine or similar sedative, the person
      has a seizure or is hard to wake. Counts as present: Recent stop or cut-down plus a seizure now or just now, or the
      person is hard to wake. Uncertain: Shaking that may or may not be a seizure. Currentness: current = now or just now.'
    route: emergency_911
    routing_relevant: true
    requires_current: true
    source: mp_alcohol_withdrawal
    source_ids:
    - mp_alcohol_withdrawal
    - mp_seizure
    - asam_aw_2020
    instruction:
      id: instr_SU-02
      text: Call 911 now. A seizure during withdrawal needs emergency care right away.
      text_other: Call 911 now for this person. Stay with them, and turn them on their side.
      fallback: Call 911 now. A seizure during withdrawal needs emergency care right away.
      fallback_other: Call 911 now for this person. Stay with them, and turn them on their side.
      source: signed:SU-02
